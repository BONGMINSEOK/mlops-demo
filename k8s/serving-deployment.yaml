apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-serving
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels: {app: iris-serving}
  template:
    metadata:
      labels: {app: iris-serving}
    spec:
      containers:
      - name: iris-serving
        image: ghcr.io/bongminseok/mlops-demo:latest
        ports:
        - containerPort: 8000
        env:
        - {name: MLFLOW_TRACKING_URI, value: "http://mlflow:5000"}
        - {name: MLFLOW_S3_ENDPOINT_URL, value: "http://minio:9000"}
        - {name: AWS_ACCESS_KEY_ID, value: "minioadmin"}
        - {name: AWS_SECRET_ACCESS_KEY, value: "minioadmin123"}
        - {name: MODEL_NAME, value: "iris-classifier"}
        readinessProbe:
          httpGet: {path: /health, port: 8000}
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: iris-serving
  namespace: mlops
spec:
  selector: {app: iris-serving}
  ports:
  - {port: 8000, targetPort: 8000}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iris-serving
  namespace: mlops
spec:
  ingressClassName: traefik
  rules:
  - host: iris.192.168.111.200.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: iris-serving, port: {number: 8000}}}
